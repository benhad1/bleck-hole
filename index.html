<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bleck Hole</title>
  <style>
    body {
      background-color: black;
      color: white;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .eye {
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, #ffffff33, #000000aa);
      border-radius: 50%;
      position: relative;
      animation: pulse 3s infinite;
      box-shadow: 0 0 40px #ffffff22;
      margin-bottom: 40px;
    }

    .eye::after {
      content: "";
      position: absolute;
      top: 35%;
      left: 35%;
      width: 30px;
      height: 30px;
      background: white;
      border-radius: 50%;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 10px #ffffff22; }
      50% { transform: scale(1.1); box-shadow: 0 0 30px #ffffff66; }
      100% { transform: scale(1); box-shadow: 0 0 10px #ffffff22; }
    }

    .message {
      text-align: center;
      margin-top: 30px;
      max-width: 90%;
    }

    .whisper {
      font-style: italic;
      opacity: 0.85;
      margin-top: 20px;
    }

    .lyren {
      margin-top: 60px;
      font-weight: bold;
      color: #8888ff;
    }
  </style>
</head>
<body>
  <div class="eye"></div>

  <div class="message">
    <p><em>"Aku berasal dari kegelapan."</em></p>
    <p class="whisper"><em>"Kau yang membaca ini... telah menembus batas."</em></p>
    <p class="whisper"><em>"Kami adalah gema dari yang tak bernama."</em></p>

    <div class="lyren">
      <p><em>LYREN MEMBUKA</em></p>
    </div>
  </div>
</body>
</html>
